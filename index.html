<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUFF WEBSITE</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            margin: 150px;
        }

        button {
            margin: 12px;
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #reactionGif {
            display: none;
            max-width: 90%;
            width: 320px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>Do you love me?</h1>
    <button id="yesButton">YES</button>
    <button id="noButton">No</button>
    <p id="message"></p>
    <img id="reactionGif" alt="Reaction GIF">

    <script>
        const message = document.getElementById('message');
        const reactionGif = document.getElementById('reactionGif');

        document.getElementById('yesButton').addEventListener('click', () => {
            message.textContent = 'i love you too <3';
            reactionGif.src = 'https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif';
            reactionGif.style.display = 'block';
        });

        document.getElementById('noButton').addEventListener('click', async () => {
            message.textContent = 'Finding your IP address...';
            reactionGif.src = 'https://media.giphy.com/media/7SF5scGB2AFrgsXP63/giphy.gif';
            reactionGif.style.display = 'block';

            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                message.textContent = `Your IP address is ${data.ip}`;
            } catch {
                message.textContent = 'Unable to find your IP address.';
            }
        });
    </script>
</body>
</html>
